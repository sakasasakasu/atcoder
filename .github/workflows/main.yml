name: Deploy Next.js site to Pages

on:
  push:
    branches: ["main"] # mainブランチにpushされたら起動
  workflow_dispatch: # 手動実行
    inputs:
      force_llm:
        description: 'Force regenerate AI reviews for all problems'
        type: boolean
        default: false
      target_contest:
        description: 'Target contest to regenerate (e.g. ABC471, leave empty for none)'
        type: string
        default: ''
      target_problem:
        description: 'Target problem to regenerate (e.g. ABC471-B, leave empty for none)'
        type: string
        default: ''
  schedule:
    - cron: "0 15 * * *" # 毎日 日本時間 0:00 (15:00 UTC) に自動実行して Diff 確定や未処理 AI レビューを更新

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: 'npm'
          cache-dependency-path: portfolio/package-lock.json

      - name: Restore LLM and AtCoder API Cache
        id: llm-cache-restore
        uses: actions/cache/restore@v4
        with:
          path: portfolio/scripts/.cache
          # 保存側は「キャッシュ内容のハッシュ」をキーに付与するため、復元はプレフィックスで最新を取得する
          key: llm-cache-v4-${{ runner.os }}
          restore-keys: |
            llm-cache-v4-${{ runner.os }}-

      - name: Install dependencies
        run: npm install
        working-directory: ./portfolio

      - name: Generate JSON Data
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          ARGS=""
          if [ "${{ github.event.inputs.force_llm }}" = "true" ]; then
            ARGS="--force-llm"
          elif [ -n "${{ github.event.inputs.target_contest }}" ]; then
            ARGS="--refresh-contest ${{ github.event.inputs.target_contest }}"
          elif [ -n "${{ github.event.inputs.target_problem }}" ]; then
            ARGS="--refresh-problem ${{ github.event.inputs.target_problem }}"
          fi
          node scripts/generate.js $ARGS
        working-directory: ./portfolio

      - name: Compute cache content hash
        id: llm-cache-hash
        run: |
          HASH="none"
          if [ -d portfolio/scripts/.cache ] && [ -n "$(find portfolio/scripts/.cache -type f | head -n 1)" ]; then
            HASH=$(find portfolio/scripts/.cache -type f -exec sha1sum {} \; | sort | sha1sum | cut -d' ' -f1)
          fi
          echo "hash=$HASH" >> "$GITHUB_OUTPUT"

      # 内容が変わった場合のみ新キーで保存する（同じ内容なら保存せずキャッシュの肥大化を防ぐ）
      - name: Save LLM and AtCoder API Cache
        if: steps.llm-cache-restore.outputs.cache-matched-key != format('llm-cache-v4-{0}-{1}', runner.os, steps.llm-cache-hash.outputs.hash)
        uses: actions/cache/save@v4
        with:
          path: portfolio/scripts/.cache
          key: llm-cache-v4-${{ runner.os }}-${{ steps.llm-cache-hash.outputs.hash }}

      # generate は既に上のステップで実行済みのため、prebuild の再生成をスキップする
      - name: Build Next.js
        run: npm run build --ignore-scripts
        working-directory: ./portfolio

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./portfolio/out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
