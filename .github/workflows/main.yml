name: Deploy Next.js site to Pages

on:
  push:
    branches: ["main"] # mainブランチにpushされたら起動
  workflow_dispatch: # 手動実行
  schedule:
    - cron: "0 15 * * *" # 毎日 日本時間 0:00 (15:00 UTC) に自動実行して Diff 確定や未処理 AI レビューを更新

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: 'npm'
          cache-dependency-path: portfolio/package-lock.json

      - name: Restore/Save LLM and AtCoder API Cache
        uses: actions/cache@v4
        with:
          path: portfolio/scripts/.cache
          key: llm-cache-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            llm-cache-${{ runner.os }}-

      - name: Install dependencies
        run: npm install
        working-directory: ./portfolio

      - name: Generate JSON Data
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node scripts/generate.js
        working-directory: ./portfolio

      - name: Build Next.js
        run: npm run build
        working-directory: ./portfolio

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./portfolio/out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
